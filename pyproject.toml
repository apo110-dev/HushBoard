[project]
name = "hushboard"
version = "1.0.0"
description = "Accountless feedback with a refundable shielded Zcash testnet bond"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "qrcode[pil]==8.2",
  "starlette==1.6.0",
  "uvicorn==0.52.4",
]

[dependency-groups]
dev = [
  "httpx2==2.12.0",
  "pytest==9.1.1",
  "ruff==0.16.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "app/tests"]
addopts = "-ra --strict-markers"
