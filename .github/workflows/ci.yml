name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out the complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.21"
          enable-cache: true
      - name: Install Python and locked dependencies
        run: |
          uv python install "${{ matrix.python-version }}"
          uv sync --locked --all-groups --python "${{ matrix.python-version }}"
      - name: Run tests
        run: uv run --no-sync pytest

  quality:
    name: Release and quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.21"
          enable-cache: true
      - name: Verify and install the lockfile
        run: |
          uv lock --check
          uv sync --locked --all-groups --python 3.11
      - name: Lint Python, shell, and JavaScript
        run: |
          uv run --no-sync ruff check app tests scripts VIDEO_PAKETI/source
          git ls-files -z '*.sh' | xargs -0 -n1 bash -n
          node --check static/app.js
          git log --check --pretty=format: --all
      - name: Audit release history
        run: uv run --no-sync python scripts/audit-public-release.py
      - name: Audit runtime dependencies
        run: |
          uv export --locked --all-groups --no-emit-project --format requirements-txt --output-file /tmp/requirements.txt
          uvx pip-audit==2.10.1 --disable-pip --require-hashes -r /tmp/requirements.txt
      - name: Smoke-test immutable offline replay
        env:
          HUSHBOARD_MODE: mock
          HUSHBOARD_NO_BROWSER: "1"
        run: |
          ./START_DEMO.sh > /tmp/hushboard-smoke.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if health=$(curl -fsS http://127.0.0.1:4173/api/health); then
              python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["ok"] and data["mode"] == "mock" and data["snapshot"]' <<<"$health"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hushboard-smoke.log
          exit 1
